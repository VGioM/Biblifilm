<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data: file:; media-src file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Biblifilm</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-scroll" id="sidebar"></div>
      <div class="side-foot" id="sidefoot"></div>
    </aside>
    <main class="main">
      <div class="toolbar">
        <button class="btn icon plain hidden" id="back" title="Retour à la bibliothèque (Alt+←)"></button>
        <button class="btn icon plain" id="playAll" title="Tout lire"></button>
        <div class="titles"><div class="title" id="title"></div><div class="subtitle" id="subtitle"></div></div>
        <span id="progress"></span>
        <button class="btn icon plain" id="options" title="Options"></button>
        <button class="btn icon plain" id="toggleInspector" title="Afficher/masquer les informations (Ctrl+I)"></button>
        <label class="search" id="searchBox"><span id="searchIcon"></span><input id="search" type="search" placeholder="Rechercher" spellcheck="false"><button class="clear" id="searchClear" title="Effacer"></button></label>
      </div>
      <div id="banner"></div>
      <div class="content" id="content"></div>
    </main>
    <aside class="inspector hidden" id="inspector"></aside>
  </div>
  <div id="playerHost"></div>
  <script src="icons.js"></script>
  <script src="ui.js"></script>
  <script src="../shared.js"></script>
  <script src="player.js"></script>
  <script src="app.js"></script>
</body>
</html>
