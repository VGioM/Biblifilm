[package]
name = "biblifilm"
version = "1.3.4"
edition = "2021"
description = "Bibliothèque de films et séries, identifiés en ligne, lus avec mpv intégré"
license = "UNLICENSED"
publish = false

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "=0.31.1"
egui_extras = { version = "=0.31.1", features = ["svg", "image"] }
egui_glow = "=0.31.1"
resvg = "0.45"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
fancy-regex = "0.14"
unicode-normalization = "0.1"
notify = "8"
sha2 = "0.10"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
trash = "5"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libloading = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
